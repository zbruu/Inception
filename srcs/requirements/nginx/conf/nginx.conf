# Nginx configuration 

# A "server{}" block = One virtual host (website/domain)
# listen = my server listens on HTTPS port 443 and with SSL enabled
# server_name = domain name associated with the server
# ssl_protocols = only allow secure TLS protocols
# ssl_certificate + private key generated in the Dockerfile with the openssl command (which allows the HTTPS and the encryption of exchanges)
# location = hangle static files and WordPress routing ; tries to serve file directly, or otherwise redirects to index.php (wordpress routing)
#location (bis) = handles PHP files by forwarding them to PHP-FPM ; loads first default FastCGI parameters, then sends PHP requests to the wordpress container (PHP-FPM), and finally tells PHP-FPM which file to execute.

server {
	listen 443 ssl;
	server_name bde-la-p.42.fr;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/ssl/certs/nginx.crt;
	ssl_certificate_key /etc/ssl/private/nginx.key;

	root /var/www/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		include fastcgi_params;
		fastcgi_pass wordpress:9000;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	}
}

# Recap in FR
# Ce fichier configure un serveur Nginx. Il sert de point d'entree HTPPS en ecoutant sur le port 443.
# Le bloc server{} definit un hote virtuel, en l'occurence un site web.
# Le serveur ecoute sur le port 443 avec SSL active (HTTPS)
# Il utilise seulement TLS 1.2 et 1.3 pour des questions de securite.
# Le certificat SSL et la clef privee sont generes dans le Dockerfile avec openssl et stockes dans /etc/ssl, conformement aux instructions du Dockerfile
# Le serveur est associe au domaine bde-la-p.42.fr