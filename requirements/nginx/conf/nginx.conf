# Nginx configuration 

# A "server{}" block = A website/domain
# listen = my server listens to port 443 and activates SSL/TLS
# server_name = domain name associated to server
# ssl_protocols = only the safe protocols
# ssl_certificate + private key generated in the Dockerfile through thr opensslcommand (which allows the HTTPS and the encryption of exchanges)
#location = directory where the website's files are located
server {
	listen 443 ssl;
	server_name bde-la-p.42.fr;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_certificate /etc/ssl/certs/nginx.crt;
	ssl_certificate_key /etc/ssl/private/nginx.key;

	location / {
		root /var/www/html;
		index index.html;
	}
}

# Recap in FR
# La configuration definit un serveur Nginx qui ecoute sur le port 443 (HTTPS)
# Il utilise seulement TLS 1.2 et 1.3 pour des questions de securite.
# Le certificat SSL est genere avec openssl et stocke dans /etc/ssl, conformement aux instructions du Dockerfile
# Le serveur est associe au domaine bde-la-p.42.fr
# Le serveur sert des fichiers statiques depuis /var/www/html avec index.html comme page par defaut.

